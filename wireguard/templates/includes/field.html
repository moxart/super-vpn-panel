<div class="field{% if field.errors %} has-error{% endif %}">
    {% if field.widget_type == 'checkbox' %}
        <label class="checkbox" for="{{ field.id_for_label }}">{{ field }} {{ field.label }}</label>
    {% else %}
        <label class="label" for="{{ field.id_for_label }}">{{ field.label }}</label>
        {% if field.widget_type == 'select' %}
            <div class="select">{{ field }}</div>
        {% else %}
            {{ field }}
        {% endif %}
    {% endif %}
    {% if field.help_text %}<p class="help">{{ field.help_text }}</p>{% endif %}
    {% for error in field.errors %}<p class="help is-danger">{{ error }}</p>{% endfor %}
</div>
